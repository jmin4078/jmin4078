name: Generate contribution snake

on:
  schedule:
    # 매일 00:00 UTC(한국 09:00)에 잔디 뱀 이미지를 다시 만든다.
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # 프로필 카드(라이트 주황)와 색을 맞춘다. 잔디 칸은 기여 없음 → 많음 순서다.
          outputs: |
            dist/github-snake.svg?color_snake=#ea580c&color_dots=#fff7ed,#fed7aa,#fdba74,#fb923c,#ea580c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#fb923c&color_dots=#161b22,#7c2d12,#c2410c,#ea580c,#fb923c

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
